        <h1>Spirit manual</h1>
        <p>
          Everything Spirit does, in one page. Install it, learn the gesture, and know exactly what
          leaves your machine.
        </p>
        <h2>Install</h2>
        <p>
          Grab the build for your platform, or run it from source. Spirit needs a screen-capture
          permission on macOS the first time it reads the cursor area.
        </p>
        <pre>git clone https://github.com/BibaPutt/Spirit-AI-Cursor.git
cd Spirit-AI-Cursor
npm install
npm run build</pre>
        <h2>Use it</h2>
        <p>
          Hold the hotkey. The capsule appears next to the cursor and starts listening. Type or
          speak your question, then release. Spirit captures the region around the pointer, reads
          text and UI elements, and sends only what is needed to the model you configured.
        </p>
        <h2>Shortcuts</h2>
        <ul>
          <li><kbd>Alt + Space</kbd> — open the prompt at the cursor</li>
          <li><kbd>Shift + Alt + Space</kbd> — open with voice recording armed</li>
          <li><kbd>Esc</kbd> — close the capsule or cancel a request</li>
          <li><kbd>Ctrl + Enter</kbd> — send without releasing the hotkey</li>
        </ul>
        <h2>Privacy</h2>
        <p>
          API keys live in an encrypted store. Session history and long-term memory stay in local
          app data. Nothing is uploaded except the capture and prompt you send to your chosen model
          provider.
        </p>
