        <h1>Spirit developer documentation</h1>
        <p>
          How Spirit works under the hood, explained twice — plain language first, code detail

        </p>
        <h2>What Spirit is</h2>
        <p>
          An Electron 30 desktop app (React 18, Vite 5, TypeScript). Hold the trigger key, ask,
          and the answer streams into an overlay beside your cursor with awareness of a small
          screenshot crop, OCR text, the OS accessibility tree, your clipboard and the foreground
          app. The model can call tools — click, type, launch, save — every mutating one behind an
          approval card, and two high-impact tools (shell, system actions) always prompt.
        </p>
        <h2>The pipeline</h2>
        <p>
          Trigger state machine → per-display overlay windows → llm:query-options → provider chain
          (OpenRouter → Anthropic → OpenAI → Gemini → local, with transient-failure retries) →
          agentic tool loop (150 s cap) → streamed chunks → takeaway memory (local BM25), session
          persistence, follow-up chips.
        </p>
        <h2>Locally enforced privacy</h2>
        <p>
          Keys encrypted with the OS keyring, sandboxed renderer with no outbound network, SSRF
          guards on URL fetching, allowlisted sanitizers on AI-generated HTML, no telemetry and no
          cloud storage — there is no Spirit server.
        </p>
        <h2>Packaging</h2>
        <p>
          Vite + vite-plugin-electron + electron-builder: NSIS for Windows, DMG/ZIP for macOS
          (arm64 + x64), AppImage for Linux. Signing and notarization are env-gated
          (CSC_LINK/CSC_KEY_PASSWORD, APPLE_ID/APPLE_TEAM_ID); releases publish to GitHub.
        </p>
