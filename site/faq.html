        <h2>Does Spirit send my screen anywhere?</h2>
        <p>Only to the model you configure. Screenshots and OCR text go with the request; nothing is stored on our side. With a local model, the whole loop stays on the machine.</p>

        <h2>Which models can I use?</h2>
        <p>OpenAI, Anthropic, Google, OpenRouter and local runtimes behind an OpenAI-compatible endpoint. Keys stay in the encrypted store.</p>

        <h2>Does it work offline?</h2>
        <p>Screen reading, OCR and voice transcription run locally. Answers need a model; a local model keeps the whole loop offline.</p>

        <h2>What are the system requirements?</h2>
        <p>Windows 10 or 11, macOS 13 or newer, or a modern Linux desktop. Four gigabytes of RAM for the app, more for a local model.</p>

        <h2>How do I change the hotkey?</h2>
        <p>Settings, then Shortcuts. Hold, toggle and voice keys are separate, and conflicts are reported before a change is saved.</p>

        <h2>Is it free?</h2>
        <p>The app is free for personal, educational, and internal business use under the Business Source License 1.1. You may read and modify the source. Hosting it as a service, white-labeling it, or redistributing it commercially requires a separate written license. The license converts to Apache 2.0 on 2030-11-01.</p>

        <h2>Can Spirit click the wrong thing?</h2>
        <p>It can. The model draws its targets from a screenshot and the accessibility tree, and either can mis-read a busy screen. That is why every click, keypress and paste shows an approval card first — read it, then allow. Denying is always one press and nothing breaks.</p>

        <h2>Does it read my passwords?</h2>
        <p>Spirit only reads what is under your cursor when you trigger it. If you hold the hotkey while a password field is in the capture, that text goes to your model provider like any other context — so don't ask questions with credentials on screen. Spirit's own keys stay encrypted in your OS keychain.</p>

        <h2>What does a question cost?</h2>
        <p>Whatever your provider charges for the tokens — typically a fraction of a cent on small models. The OpenRouter models Spirit ships with are free. Use a local model and it costs nothing but electricity.</p>

        <h2>Windows shows a SmartScreen warning when I install</h2>
        <p>That is because the installer is not code-signed yet — SmartScreen flags any unsigned download. Click More info, then Run anyway, or grab the build from the official GitHub releases. Signing is wired up and switches on as soon as a certificate is configured.</p>

        <h2>Does it work over games?</h2>
        <p>In windowed or borderless mode, usually yes. Exclusive fullscreen games can block overlays entirely, and some anti-cheat systems dislike input automation — use it for browsing, documents and dev tools, not ranked matches.</p>

        <h2>How do I wipe everything Spirit knows?</h2>
        <p>Open the Memory panel to delete single takeaways, or delete the workspace folder and config.json in app data to erase sessions, memory and settings completely. Uninstalling never silently wipes your files.</p>

        <h2>Can I use my company's OpenAI key?</h2>
        <p>Yes — the key stays in your machine's keychain and requests go straight from your machine to the provider. Do check your company policy on what may be sent to that provider, since your prompts and screen context travel with the question.</p>

        <h2>Why is the answer sometimes wrong?</h2>
        <p>Because models are statistical, not factual databases. Screen context keeps answers grounded in what is actually on your display, but for anything that matters — numbers, names, commands that delete things — treat the answer as a draft and verify.</p>
