        <h1>Spirit — ask your cursor</h1>
        <p>
          Spirit is a desktop AI companion for Windows, macOS and Linux. Hold a key, ask about
          whatever is on screen, and the answer arrives in place. No tab switching, no copying
          context.
        </p>
        <h2>What it does</h2>
        <ul>
          <li>Reads the screen under the cursor with OCR and the accessibility tree.</li>
          <li>Answers beside the cursor instead of in a separate chat window.</li>
          <li>Clicks, types, scrolls and presses keys through the same input driver.</li>
          <li>Transcribes voice locally with Whisper.</li>
          <li>Works with OpenAI, Anthropic, Google, OpenRouter or a local model key.</li>
          <li>Keeps keys and memory on disk, under your control.</li>
        </ul>
        <h2>Install</h2>
        <ol>
          <li>Download the build for your platform.</li>
          <li>Open Spirit and grant screen-capture permission if your OS asks.</li>
          <li>Add your model key in Settings.</li>
          <li>Hold <kbd>Alt + Space</kbd>, ask, and read.</li>
        </ol>
        <h2>Common questions</h2>
        <dl>
          <dt>Does Spirit send my screen anywhere?</dt>
          <dd>Only to the model you configure. A local model keeps the whole loop on the machine.</dd>
          <dt>Is it free?</dt>
          <dd>Yes, for personal, educational, and internal business use under the Business Source License 1.1; you pay only for the model you choose.</dd>
          <dt>Which platforms are supported?</dt>
          <dd>Windows 10/11, macOS 13+ and modern Linux desktops.</dd>
        </dl>
        <p>
